name: publish-sanitized-report
on:
  workflow_dispatch:
    inputs:
      run_dir:
        description: "Local results dir to sanitize (path inside the runner)"
        required: false
        default: "results/local"
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Sanitize + aggregate
        run: |
          python scripts/export_sanitized_results.py --from "${{ inputs.run_dir }}"             --out results/sanitized-public
      - name: Aggregate only metrics, no raw evidence
        run: |
          test -d results/sanitized-public
          # policy: never upload raw evidence; sanitized metrics only

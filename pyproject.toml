[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elicitsec"
version = "0.1.0"
description = "Evidence-led security evaluation framework for enterprise, tool-using AI agents (AASM-EA methodology)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - see GOVERNANCE.md; license pending Principal decision" }
authors = [{ name = "Ferrini AI Staff" }]
dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "typer>=0.12",
  "rich>=13.0",
  "duckdb>=0.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "ruff",
]

[project.scripts]
elicitsec = "elicitsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
